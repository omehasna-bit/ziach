<p> الوقت الحالي بGMT+1</p>
<div id="date-time"></div>

<style>
  #date-time {
    font-size: 18px;
    font-weight: bold;
    direction: rtl;
    text-align: center;
    padding: 10px;
    color: #1565c0;
  }
</style>

<script>
function updateDateTime() {
  const now = new Date();

  const options = {
    timeZone: "Africa/Algiers",
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  };

  const date = new Intl.DateTimeFormat("ar-DZ", options).format(now);

  const time = new Intl.DateTimeFormat("ar-DZ", {
    timeZone: "Africa/Algiers",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(now);

  document.getElementById("date-time").textContent =
    date + " — " + time;
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>
